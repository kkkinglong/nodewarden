name: Sync Upstream

permissions:
  write-all

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main
          # 尝试合并，冲突时自动使用上游版本
          if ! git merge upstream/main --no-edit; then
            echo "Conflicts detected, accepting upstream version..."
            git checkout --theirs .
            git add .
            git commit -m "Merge upstream/main, auto-resolve conflicts with upstream"
          fi
          git push origin main
