jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream with merge
        run: |
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main
          # 尝试合并，若冲突则自动接受上游版本
          if ! git merge upstream/main --no-edit; then
            echo "Merge conflict detected, resolving by accepting upstream changes..."
            git checkout --theirs .
            git add .
            git commit -m "Merge upstream/main and resolve conflicts by accepting upstream"
          fi
          git push origin main
